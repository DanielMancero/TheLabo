<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entraînement rythmique V10 autonome</title>
<style>
:root{--bg:#a8aeb4;--panel:#c5cacf;--ink:#111;--blue:#8fb6cc;--green:#91b89d;--red:#d5a0a0;--violet:#a99ac2;--gold:#b89532;--paper:#f7f7f5;--border:#737b82}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}button{font:inherit;color:var(--ink);border:0;border-radius:8px;cursor:pointer}.screen{display:none;min-height:100vh;text-align:center;padding:30px}.screen.active{display:block}h1{margin-top:40px}.subtitle{font-size:18px;margin:25px}.big{display:block;width:min(430px,90vw);margin:18px auto;padding:24px;font-size:22px;font-weight:700}.big small{font-size:17px}.blue{background:var(--blue)}.violet{background:var(--violet)}.secondary{background:var(--panel);font-weight:700;padding:12px 18px;margin:8px}.measure{display:block;width:min(280px,80vw);margin:12px auto;padding:20px;background:var(--blue);font-size:22px;font-weight:700}.listen{background:var(--blue);font-weight:700;padding:14px 24px;margin:8px}.status{min-height:24px;font-weight:700}.answers{max-width:900px;margin:auto}.answer{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px;margin:10px auto}.choice{width:58px;height:92px;background:var(--panel);font-size:22px;font-weight:700}.staff{flex:1;width:100%;height:110px;background:var(--paper);border:2px solid var(--border);border-radius:4px;touch-action:manipulation}.answer.correct,.choice.correct{background:var(--green)!important}.answer.wrong,.choice.wrong{background:var(--red)!important}.toolbar{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;margin:14px}.next{background:var(--green);font-weight:700;padding:12px 18px}.next:disabled,.listen:disabled{opacity:.55;cursor:default}.help{font-size:13px;color:#41474c}.reward{display:none;position:fixed;inset:0;z-index:9999;background:rgba(65,70,75,.9);align-items:center;justify-content:center;padding:18px}.reward.show{display:flex}.reward-card{position:relative;overflow:hidden;width:min(650px,94vw);min-height:420px;background:#e3ded2;border:4px solid #555b60;border-radius:22px;box-shadow:0 18px 60px #0006;display:flex;flex-direction:column;align-items:center;justify-content:center}.reward h2{font-size:clamp(36px,8vw,52px);color:#715317;margin:0;animation:pulse .7s infinite alternate}.ten{font-size:clamp(54px,11vw,72px);font-weight:800;color:#245b36;margin:18px}.replay{background:var(--green);padding:15px 34px;font-weight:800;font-size:19px}.star{position:absolute;color:var(--gold);font-size:34px;animation:float 1.5s infinite alternate ease-in-out}.s1{left:8%;top:12%}.s2{right:8%;top:16%;animation-delay:.3s}.s3{left:12%;bottom:12%;animation-delay:.6s}.s4{right:12%;bottom:14%;animation-delay:.9s}@keyframes pulse{to{transform:scale(1.12)}}@keyframes float{to{transform:translateY(24px) rotate(35deg);color:#477a99}}@media(max-width:760px){.screen{padding:16px}.answer{gap:5px}.choice{width:45px}.staff{height:100px}.help{line-height:1.5}}
</style>
</head>
<body>
<main>
<section id="home" class="screen active"><h1>ENTRAÎNEMENT RYTHMIQUE</h1><p class="subtitle">Choisissez le type de subdivision</p><button id="binary" class="big blue" type="button">SUBDIVISION BINAIRE<br><small>2/4 · 3/4 · 4/4</small></button><button id="ternary" class="big violet" type="button">SUBDIVISION TERNAIRE<br><small>6/8</small></button><p>Une manche comporte 10 questions.<br><strong>Objectif : 10 / 10 !</strong></p></section>
<section id="measures" class="screen"><h1>CHOIX DE LA MESURE</h1><h2 id="typeTitle"></h2><p id="typeText"></p><div id="measureButtons"></div><button id="backType" class="secondary" type="button">← CHANGER DE TYPE</button></section>
<section id="game" class="screen"><h1>ENTRAÎNEMENT RYTHMIQUE</h1><h2 id="measureTitle"></h2><button id="listen" class="listen" type="button">▶ ÉCOUTER / RÉÉCOUTER</button><p id="status" class="status"></p><div id="answers" class="answers"></div><p id="explanation" class="status"></p><div class="toolbar"><strong id="scoreText">Score : 0 / 0 | 0 %</strong><button id="next" class="next" type="button" disabled>QUESTION SUIVANTE →</button></div><div class="toolbar"><button id="changeMeasure" class="secondary" type="button">← CHANGER DE MESURE</button><button id="changeType" class="secondary" type="button">CHANGER DE SUBDIVISION</button></div><p class="help">A / B / C : répondre · ESPACE : réécouter · Tempo : noire = 80</p></section>
</main>
<div id="reward" class="reward" aria-hidden="true"><div class="reward-card"><span class="star s1">★</span><span class="star s2">★</span><span class="star s3">★</span><span class="star s4">★</span><h2>★ BRAVO ! ★</h2><div class="ten">10 / 10</div><h3>MANCHE PARFAITE !</h3><button id="replay" class="replay" type="button">REJOUER</button></div></div>
<script>
'use strict';
const TEMPO=80, MAX_Q=10, AUTO_DELAY=1100, END_DELAY=650, REWARD_MS=6500;
let currentType=null,currentMeasure=null,score=0,count=0,correct=null,options=[],answered=false,ended=false,timer=null,rewardTimer=null,audioCtx=null;
const $=id=>document.getElementById(id);
const E={home:$('home'),measures:$('measures'),game:$('game'),typeTitle:$('typeTitle'),typeText:$('typeText'),measureButtons:$('measureButtons'),measureTitle:$('measureTitle'),listen:$('listen'),status:$('status'),answers:$('answers'),explanation:$('explanation'),scoreText:$('scoreText'),next:$('next'),reward:$('reward'),replay:$('replay')};
const BANK=[
{m:'2/4',n:'Deux noires',e:[['N',1],['N',1]]},{m:'2/4',n:'Noire puis deux croches',e:[['N',1],['N',.5],['N',.5]]},{m:'2/4',n:'Deux croches puis noire',e:[['N',.5],['N',.5],['N',1]]},{m:'2/4',n:'Quatre croches',e:[['N',.5],['N',.5],['N',.5],['N',.5]]},{m:'2/4',n:'Silence puis noire',e:[['R',1],['N',1]]},{m:'2/4',n:'Noire puis silence',e:[['N',1],['R',1]]},{m:'2/4',n:'Croche deux doubles noire',e:[['N',.5],['N',.25],['N',.25],['N',1]]},{m:'2/4',n:'Deux doubles croche noire',e:[['N',.25],['N',.25],['N',.5],['N',1]]},{m:'2/4',n:'Quatre doubles puis noire',e:[['N',.25],['N',.25],['N',.25],['N',.25],['N',1]]},{m:'2/4',n:'Blanche',e:[['N',2]]},
{m:'3/4',n:'Trois noires',e:[['N',1],['N',1],['N',1]]},{m:'3/4',n:'Blanche puis noire',e:[['N',2],['N',1]]},{m:'3/4',n:'Noire puis blanche',e:[['N',1],['N',2]]},{m:'3/4',n:'Noire pointée croche noire',e:[['N',1.5],['N',.5],['N',1]]},{m:'3/4',n:'Silence puis deux noires',e:[['R',1],['N',1],['N',1]]},{m:'3/4',n:'Noire silence noire',e:[['N',1],['R',1],['N',1]]},{m:'3/4',n:'Six croches',e:[['N',.5],['N',.5],['N',.5],['N',.5],['N',.5],['N',.5]]},{m:'3/4',n:'Blanche pointée',e:[['N',3]]},
{m:'4/4',n:'Quatre noires',e:[['N',1],['N',1],['N',1],['N',1]]},{m:'4/4',n:'Deux blanches',e:[['N',2],['N',2]]},{m:'4/4',n:'Blanche puis deux noires',e:[['N',2],['N',1],['N',1]]},{m:'4/4',n:'Deux noires puis blanche',e:[['N',1],['N',1],['N',2]]},{m:'4/4',n:'Silence puis trois noires',e:[['R',1],['N',1],['N',1],['N',1]]},{m:'4/4',n:'Noire silence deux noires',e:[['N',1],['R',1],['N',1],['N',1]]},{m:'4/4',n:'Deux croches noire blanche',e:[['N',.5],['N',.5],['N',1],['N',2]]},{m:'4/4',n:'Blanche puis quatre croches',e:[['N',2],['N',.5],['N',.5],['N',.5],['N',.5]]},
{m:'6/8',n:'Deux noires pointées',e:[['N',1.5],['N',1.5]]},{m:'6/8',n:'Six croches',e:[['N',.5],['N',.5],['N',.5],['N',.5],['N',.5],['N',.5]]},{m:'6/8',n:'Noire croche noire croche',e:[['N',1],['N',.5],['N',1],['N',.5]]},{m:'6/8',n:'Croche noire croche noire',e:[['N',.5],['N',1],['N',.5],['N',1]]},{m:'6/8',n:'Trois croches puis noire pointée',e:[['N',.5],['N',.5],['N',.5],['N',1.5]]},{m:'6/8',n:'Noire pointée puis trois croches',e:[['N',1.5],['N',.5],['N',.5],['N',.5]]},{m:'6/8',n:'Silence de croche puis cinq croches',e:[['R',.5],['N',.5],['N',.5],['N',.5],['N',.5],['N',.5]]},{m:'6/8',n:'Noire pointée puis silence pointé',e:[['N',1.5],['R',1.5]]},{m:'6/8',n:'Croche silence croche puis trois croches',e:[['N',.5],['R',.5],['N',.5],['N',.5],['N',.5],['N',.5]]}
];
function show(id){clearTimeout(timer);closeReward();document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
function chooseType(type){currentType=type;show('measures');E.typeTitle.textContent=type==='binaire'?'SUBDIVISION BINAIRE':'SUBDIVISION TERNAIRE';E.typeText.textContent=type==='binaire'?'Choisissez la signature de mesure.':'En 6/8, chaque pulsation de noire pointée contient trois croches.';E.measureButtons.innerHTML='';(type==='binaire'?['2/4','3/4','4/4']:['6/8']).forEach(m=>{const b=document.createElement('button');b.className='measure';b.type='button';b.textContent=m;b.onclick=()=>startGame(m);E.measureButtons.appendChild(b);});}
function startGame(m){currentMeasure=m;show('game');E.measureTitle.textContent=(m==='6/8'?'Subdivision ternaire':'Subdivision binaire')+' | Mesure '+m;resetRound();}
function resetRound(){clearTimeout(timer);closeReward();score=0;count=0;answered=false;ended=false;correct=null;options=[];updateScore();E.listen.disabled=false;E.next.onclick=nextQuestion;nextQuestion();}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function nextQuestion(){clearTimeout(timer);timer=null;if(ended)return;if(count>=MAX_Q){finish();return;}answered=false;E.next.onclick=nextQuestion;const available=BANK.filter(r=>r.m===currentMeasure);correct=available[Math.floor(Math.random()*available.length)];options=shuffle([correct,...shuffle(available.filter(r=>r!==correct)).slice(0,2)]);E.answers.innerHTML='';options.forEach((r,i)=>{const row=document.createElement('div');row.className='answer';const b=document.createElement('button');b.type='button';b.className='choice';b.textContent='ABC'[i];const c=document.createElement('canvas');c.className='staff';c.width=700;c.height=110;b.onclick=()=>answer(i);c.onclick=()=>answer(i);row.append(b,c);E.answers.appendChild(row);draw(c,r);});E.status.textContent=`Question ${count+1} / ${MAX_Q} : écoutez puis choisissez.`;E.status.style.color='#111';E.explanation.textContent='';E.next.disabled=true;E.next.textContent='QUESTION SUIVANTE →';setTimeout(playRhythm,350);}
function answer(i){if(answered||ended||!options[i])return;answered=true;count++;const correctIndex=options.indexOf(correct),rows=[...E.answers.children],good=i===correctIndex;rows.forEach(r=>r.querySelector('button').disabled=true);rows[correctIndex].classList.add('correct');if(good){score++;E.status.textContent='✓ Bonne réponse !';E.status.style.color='#245b36';E.explanation.textContent=correct.m+' · '+correct.n;}else{rows[i].classList.add('wrong');E.status.textContent='✗ Réponse incorrecte.';E.status.style.color='#7f2525';E.explanation.textContent='Bonne réponse : '+correct.n;}updateScore();if(count===MAX_Q){E.next.disabled=true;timer=setTimeout(finish,END_DELAY);return;}if(good){E.next.textContent='QUESTION SUIVANTE...';timer=setTimeout(nextQuestion,AUTO_DELAY);}else{E.next.disabled=false;}}
function updateScore(){const pct=count?Math.round(score/count*100):0;E.scoreText.textContent=`Score : ${score} / ${count} | ${pct} %`;}
function finish(){if(ended||count!==MAX_Q)return;ended=true;E.listen.disabled=true;if(score===MAX_Q){E.status.textContent='★ BRAVO ! 10 / 10 ! ★';E.status.style.color='#245b36';E.explanation.textContent='Manche parfaite !';E.reward.classList.add('show');E.reward.setAttribute('aria-hidden','false');clearTimeout(rewardTimer);rewardTimer=setTimeout(closeReward,REWARD_MS);E.next.disabled=false;E.next.textContent='REJOUER';E.next.onclick=resetRound;}else{E.status.textContent=`Fin de la manche : ${score} / ${MAX_Q}`;E.status.style.color='#111';E.explanation.textContent='Bien essayé ! Recommencez pour atteindre 10 / 10.';E.next.disabled=false;E.next.textContent='RECOMMENCER';E.next.onclick=resetRound;}}
function closeReward(){clearTimeout(rewardTimer);rewardTimer=null;E.reward.classList.remove('show');E.reward.setAttribute('aria-hidden','true');}
async function playRhythm(){if(!correct||ended)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC){E.status.textContent='Audio Web non pris en charge.';return;}audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')await audioCtx.resume();const beat=60/TEMPO,start=audioCtx.currentTime+.05;let pos=0;for(const [type,d] of correct.e){if(type==='N')tone(start+pos*beat,d*beat,d);pos+=d;}}
function tone(t,seconds,value){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=700;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.32,t+.008);if(value>=2){const end=t+Math.max(.15,seconds-.04);g.gain.exponentialRampToValueAtTime(.055,Math.max(t+.02,end-.08));g.gain.exponentialRampToValueAtTime(.0001,end);o.start(t);o.stop(end+.02);}else{const end=t+Math.min(.07,seconds*.8);g.gain.exponentialRampToValueAtTime(.0001,end);o.start(t);o.stop(end+.02);}}
function draw(c,r){const x=c.getContext('2d'),w=c.width,y=56;x.clearRect(0,0,w,c.height);x.strokeStyle='#000';x.fillStyle='#000';for(let i=0;i<5;i++){x.beginPath();x.moveTo(45,y-16+i*8);x.lineTo(w-15,y-16+i*8);x.stroke();}const [a,b]=r.m.split('/');x.font='bold 15px Arial';x.fillText(a,62,y-6);x.fillText(b,62,y+12);const total=r.e.reduce((s,e)=>s+e[1],0);let pos=0;for(const [type,d] of r.e){const cx=100+((pos+d/2)/total)*(w-135);if(type==='R')drawRest(x,cx,y,d);else drawNote(x,cx,y,d);pos+=d;}}
function drawNote(x,cx,y,d){x.save();x.strokeStyle=x.fillStyle='#000';x.lineWidth=2;x.beginPath();x.ellipse(cx,y,7,5,0,0,Math.PI*2);d>=2?x.stroke():x.fill();x.beginPath();x.moveTo(cx+6,y);x.lineTo(cx+6,y-33);x.stroke();if(d===1.5||d===3){x.beginPath();x.arc(cx+16,y,2,0,Math.PI*2);x.fill();}if(d<=.5){x.beginPath();x.moveTo(cx+6,y-33);x.quadraticCurveTo(cx+21,y-27,cx+15,y-15);x.stroke();if(d===.25){x.beginPath();x.moveTo(cx+6,y-26);x.quadraticCurveTo(cx+20,y-20,cx+15,y-9);x.stroke();}}x.restore();}
function drawRest(x,cx,y,d){x.save();x.fillStyle=x.strokeStyle='#000';if(d>=2){x.fillRect(cx-9,y-2,18,6);if(d===3){x.beginPath();x.arc(cx+16,y+1,2,0,Math.PI*2);x.fill();}}else if(d>=1){x.lineWidth=3;x.beginPath();x.moveTo(cx-3,y-16);x.lineTo(cx+4,y-6);x.lineTo(cx-2,y+1);x.lineTo(cx+5,y+11);x.lineTo(cx-4,y+7);x.stroke();if(d===1.5){x.beginPath();x.arc(cx+13,y,2,0,Math.PI*2);x.fill();}}else{x.beginPath();x.arc(cx,y-9,4,0,Math.PI*2);x.fill();x.lineWidth=2;x.beginPath();x.moveTo(cx+2,y-7);x.lineTo(cx-5,y+14);x.stroke();if(d===.25){x.beginPath();x.arc(cx+5,y-17,3.5,0,Math.PI*2);x.fill();}}x.restore();}
$('binary').onclick=()=>chooseType('binaire');$('ternary').onclick=()=>chooseType('ternaire');$('backType').onclick=()=>show('home');E.listen.onclick=playRhythm;E.next.onclick=nextQuestion;$('changeMeasure').onclick=()=>currentType&&chooseType(currentType);$('changeType').onclick=()=>show('home');E.replay.onclick=()=>{closeReward();resetRound();};
window.addEventListener('keydown',e=>{if(!E.game.classList.contains('active')||E.reward.classList.contains('show'))return;const k=e.key.toLowerCase();if(['a','b','c'].includes(k)&&E.answers.children.length===3)answer('abc'.indexOf(k));if(e.code==='Space'){e.preventDefault();playRhythm();}});
show('home');
</script>
</body>
</html>
